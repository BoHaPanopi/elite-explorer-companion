name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enforce protected product rules on the release path
        run: npm run test:release-guards
      - name: Test journal recognition
        working-directory: src-tauri
        run: cargo test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Old Guy of Grumpy ${{ github.ref_name }}
          releaseBody: |
            ENGLISH

            Alpha 0.14.20

            - Improved exploration and exobiology event processing.
            - Improved prediction and biological observation handling.
            - Improved runtime stability and decision routing.
            - Additional regression protection for critical application paths.

            DEUTSCH

            Alpha 0.14.20

            - Die Verarbeitung von Exploration- und Exobiologie-Ereignissen wurde verbessert.
            - Vorhersagen und biologische Beobachtungen werden zuverlässiger verarbeitet.
            - Laufzeitstabilität und Entscheidungsrouting wurden verbessert.
            - Kritische Anwendungspfade wurden zusätzlich gegen Regressionen abgesichert.
          releaseDraft: false
          prerelease: false
