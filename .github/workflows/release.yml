name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - name: Test commander-specific activation rules
        run: npm run test:tony
      - name: Prepare OGG voice server build
        shell: pwsh
        run: |
          python -m venv src/tools/ogg-voice/.venv
          src/tools/ogg-voice/.venv/Scripts/python.exe -m pip install --disable-pip-version-check edge-tts flask flask-cors pyinstaller
          cmd /c src\tools\ogg-voice\BUILD_OGG_STIMME.bat
      - name: Test journal recognition
        working-directory: src-tauri
        run: cargo test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Old Guy of Grumpy v__VERSION__
          releaseBody: |
            OGG v0.14.6 localization, updater reliability, and mission-status layout release.

            - Expanded German and English localization across cockpit and assistant views
            - Clearer onboard-computer lock state and commander-specific activation behavior
            - More reliable deferred update installation, startup recovery, and local test builds
            - Centered mission-status card content for a cleaner, balanced command-center layout
            - Additional automated coverage for startup recovery and fresh Windows profiles
          releaseDraft: false
          prerelease: false
