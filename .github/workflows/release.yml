name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test commander-specific activation rules
        run: npm run test:tony
      - name: Test journal recognition
        working-directory: src-tauri
        run: cargo test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Old Guy of Grumpy v__VERSION__
          releaseBody: |
            Old Guy of Grumpy v0.14.11

            - Fixed application close permissions on Windows.
            - Restored closing via the window close button and taskbar.
            - Improved exit-path regression coverage.
            - Preserved deferred updater behavior.
          releaseDraft: false
          prerelease: false
