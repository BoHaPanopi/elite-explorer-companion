name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test commander-specific activation rules
        run: npm run test:tony
      - name: Test journal recognition
        working-directory: src-tauri
        run: cargo test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v0.14.15
          releaseName: Old Guy of Grumpy v0.14.15
          releaseBody: |
            Old Guy of Grumpy v0.14.15

            - Neues Command Center mit profilabhängigen Rängen für Exploration, Exobiologie, Handel und Kampf.
            - Aktuelles Schiff mit Schiffsname, Kennung und Frontier-Schiffsdarstellung.
            - Willi ergänzt lokale Reise- und Navigationshistorie.
            - Permanenter Datenflussstatus trennt lokale Crew-Verarbeitung klar von externen Freigaben.
            - Hintergrundindex und inkrementelle Verarbeitung beschleunigen lokale Journal- und Telemetrieauswertung deutlich.
            - Updates werden beim Beenden installiert und starten OGG nicht automatisch neu.
          releaseDraft: false
          prerelease: false
