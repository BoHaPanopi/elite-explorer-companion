name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - name: Test commander-specific activation rules
        run: npm run test:tony
      - name: Prepare OGG voice server build
        shell: pwsh
        run: |
          python -m venv src/tools/ogg-voice/.venv
          src/tools/ogg-voice/.venv/Scripts/python.exe -m pip install --disable-pip-version-check edge-tts flask flask-cors pyinstaller
          cmd /c src\tools\ogg-voice\BUILD_OGG_STIMME.bat
      - name: Test journal recognition
        working-directory: src-tauri
        run: cargo test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Old Guy of Grumpy v__VERSION__
          releaseBody: |
            Alpha 0.14.1 maintenance release.

            - Reliable live ship-status detection
            - Expanded journal recognition for exploration, mapping, and biological discoveries
            - Refined Command Center information hierarchy
            - Commander-specific cockpit refinements
          releaseDraft: false
          prerelease: false
