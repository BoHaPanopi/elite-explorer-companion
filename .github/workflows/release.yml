name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test commander-specific activation rules
        run: npm run test:tony
      - name: Test journal recognition
        working-directory: src-tauri
        run: cargo test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Old Guy of Grumpy ${{ github.ref_name }}
          releaseBody: |
            Old Guy of Grumpy ${{ github.ref_name }}

            ## English

            - Public alpha releases are published through GitHub Latest so the existing updater can reliably discover new versions.
            - Updates install on exit without automatically restarting OGG.

            ## Deutsch

            - Öffentliche Alpha-Releases werden über GitHub Latest veröffentlicht, damit der bestehende Updater neue Versionen zuverlässig erkennt.
            - Updates werden beim Beenden installiert und starten OGG anschließend nicht automatisch neu.
          releaseDraft: false
          prerelease: false
