name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test commander-specific activation rules
        run: npm run test:tony
      - name: Enforce public terminology policy
        run: npm run test:public-copy
      - name: Test journal recognition
        working-directory: src-tauri
        run: cargo test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Old Guy of Grumpy ${{ github.ref_name }}
          releaseBody: |
            ## English

            Old Guy of Grumpy v0.14.18

            - Audio fixes and improved voice startup reliability.

            ## Deutsch

            Old Guy of Grumpy v0.14.18

            - Audiokorrekturen und verbesserte Zuverlässigkeit der Sprachausgabe beim Start.
          releaseDraft: false
          prerelease: false
